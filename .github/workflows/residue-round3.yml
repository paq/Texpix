name: Residue round 3 experiments
on:
  push:
    branches: ['perf/residue-round3']
permissions:
  contents: read
jobs:
  fxc:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compare pinned shader candidates
        shell: pwsh
        run: |
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\fxc.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw 'FXC unavailable' }
          python Tools/ResidueRound3/experiment.py --fxc $fxc.FullName --output round3-results
          if ($LASTEXITCODE -ne 0) { throw 'FXC experiment failed' }
          python Tools/ResidueRound3/warp_sources.py --fxc $fxc.FullName --output round3-results
          if ($LASTEXITCODE -ne 0) { throw 'Actual-source stage generation failed' }
      - name: Execute actual HLSL on D3D11 WARP
        shell: pwsh
        run: |
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC unavailable' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          @('@echo off', "call `"$devcmd`" -no_logo -arch=x64", 'if errorlevel 1 exit /b 1', 'cl /nologo /std:c++17 /EHsc /O2 Tools\ResidueRound3\warp.cpp /Fe:round3-results\warp.exe /link d3d11.lib', 'exit /b %errorlevel%') | Set-Content -Encoding ascii build-warp.cmd
          cmd /c build-warp.cmd
          if ($LASTEXITCODE -ne 0) { throw 'WARP harness compilation failed' }
          & .\round3-results\warp.exe round3-results
          if ($LASTEXITCODE -ne 0) { throw 'WARP correctness failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: residue-round3-fxc
          path: round3-results/
          retention-days: 14
